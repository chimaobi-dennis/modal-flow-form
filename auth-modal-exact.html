
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Modal - Exact Match</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scale-in {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-fade-in {
            animation: fade-in 0.3s ease-out;
        }

        .animate-scale-in {
            animation: scale-in 0.3s ease-out;
        }

        .modal-backdrop-custom {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(239, 246, 255, 0.95), rgba(243, 232, 255, 0.9), rgba(236, 254, 255, 0.95));
            backdrop-filter: blur(12px);
            z-index: 1040;
        }

        .modal-content-custom {
            position: relative;
            width: 100%;
            max-width: 28rem;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .modal-header-custom {
            position: relative;
            background: linear-gradient(135deg, #ffffff, #dbeafe, #e9d5ff);
            padding: 2rem;
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 2.5rem;
            height: 2.5rem;
            border: none;
            background: none;
            color: #6b7280;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #374151;
            background: rgba(107, 114, 128, 0.1);
            transform: scale(1.1);
        }

        .close-btn svg {
            transition: transform 0.3s ease;
        }

        .close-btn:hover svg {
            transform: rotate(90deg);
        }

        .icon-container {
            width: 4rem;
            height: 4rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .modal-subtitle {
            color: #6b7280;
        }

        .modal-body-custom {
            padding: 2rem;
        }

        .btn-google {
            width: 100%;
            background: white;
            border: 2px solid #e5e7eb;
            color: #374151;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1.125rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .btn-google:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transform: scale(1.05);
            border-color: #ef4444;
            background: #fef2f2;
            color: #374151;
        }

        .divider {
            position: relative;
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }

        .divider::before {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            padding: 0 1rem;
            font-size: 0.875rem;
            color: #6b7280;
            background: white;
        }

        .btn-signin {
            width: 100%;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1.125rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .btn-signin:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            transform: scale(1.05);
        }

        .btn-register {
            width: 100%;
            background: white;
            border: 2px solid #e5e7eb;
            color: #374151;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1.125rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transform: scale(1.05);
            border-color: #3b82f6;
            color: #374151;
        }

        .footer-text {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .footer-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            margin-left: 0.25rem;
        }

        .footer-link:hover {
            color: #1d4ed8;
        }

        /* Hero section styles */
        body {
            background: linear-gradient(135deg, #f8faff 0%, #e8f2ff 50%, #f0f8ff 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .hero-container {
            text-align: center;
            max-width: 600px;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .hero-btn {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.125rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .hero-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <div class="hero-container">
        <h1 class="hero-title">Welcome Back! 👋</h1>
        <p class="hero-subtitle">Access your account to unlock all features</p>
        <button class="hero-btn" onclick="openAuthModal()">
            Sign In to Continue
        </button>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" style="display: none;">
        <div class="modal-backdrop-custom animate-fade-in" onclick="closeAuthModal()"></div>
        
        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 1050; padding: 1rem;">
            <div class="modal-content-custom animate-scale-in">
                <!-- Header -->
                <div class="modal-header-custom">
                    <button class="close-btn" onclick="closeAuthModal()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                    
                    <div style="text-align: center;">
                        <div class="icon-container">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <h2 class="modal-title">Sign In to Continue</h2>
                        <p class="modal-subtitle">Access your account to unlock all features</p>
                    </div>
                </div>
                
                <!-- Content -->
                <div class="modal-body-custom">
                    <!-- Google Sign In Button -->
                    <button class="btn-google" onclick="handleGoogleSignIn()">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Continue with Google
                    </button>
                    
                    <!-- Divider -->
                    <div class="divider">
                        <span>or</span>
                    </div>
                    
                    <button class="btn-signin" onclick="handleSignIn()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10,17 15,12 10,7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        Sign In with Email
                    </button>
                    
                    <button class="btn-register" onclick="handleRegister()">
                        Create Account
                    </button>
                    
                    <div class="footer-text">
                        New to our platform?
                        <a href="#" class="footer-link" onclick="handleRegister()">Get started today</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openAuthModal() {
            document.getElementById('authModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function handleSignIn() {
            // Navigate to sign-in page
            window.location.href = '/signin';
        }

        function handleRegister() {
            // Navigate to register page
            window.location.href = '/register';
        }

        function handleGoogleSignIn() {
            // Handle Google OAuth sign-in
            console.log('Google sign-in initiated');
            // In a real app, this would redirect to Google OAuth
            alert('Google sign-in would be implemented here');
        }

        // Close modal when pressing Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeAuthModal();
            }
        });
    </script>
</body>
</html>
